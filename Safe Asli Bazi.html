<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>بازی مافیا | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-page {
            width: 100%;
            min-height: 100vh;
            background-image: url('IMG_20260607_170932_059.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            padding: 20px;
        }

        .account-card {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 15px 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.25);
            transition: 0.2s;
        }
        .account-card:hover {
            background: rgba(0,0,0,0.75);
            transform: scale(1.02);
        }
        .account-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2ecc71;
        }
        .account-info {
            color: white;
        }
        .account-name {
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .rank-tick {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }
        .tick-blue-dark { background: #0088ff; }
        .tick-blue-light { background: #66ccff; }
        .tick-red { background: #ff4444; }
        .tick-black { background: #222; }
        .tick-brown { background: #8B4513; }
        .tick-orange { background: #ff9900; }
        .tick-purple { background: #9b59b6; }
        .tick-white { background: #ffffff; color: #000; }

        .account-level {
            font-size: 10px;
            opacity: 0.8;
        }

        .currency-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            align-items: center;
        }
        .currency-item {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffd966;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .app-menu-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 150;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .menu-toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #4a4a5a;
            border: 1px solid #6a6a7a;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .menu-toggle-btn:active {
            transform: scale(0.92);
            background: #3a3a4a;
        }
        .menu-toggle-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e94560;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 20px;
            display: none;
        }

        .app-menu {
            background: rgba(20, 25, 35, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(110, 172, 218, 0.5);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 190px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            margin-top: 8px;
            display: none;
            flex-direction: column;
            gap: 1px;
        }
        .app-menu.open {
            display: flex;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #e0e0e0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-family: inherit;
        }
        .menu-item:hover {
            background: rgba(110, 172, 218, 0.15);
        }
        .menu-item:active {
            background: rgba(110, 172, 218, 0.25);
            transform: scale(0.98);
        }
        .menu-item .icon {
            font-size: 18px;
            min-width: 30px;
            text-align: center;
        }
        .menu-item .label {
            flex: 1;
        }
        .menu-item .arrow {
            color: #5a6a7a;
            font-size: 14px;
        }
        .menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 3px 14px;
        }

        .server-menu-backdrop {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 180;
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .server-menu-backdrop.show {
            display: block;
            opacity: 1;
        }

        .server-menu-overlay {
            position: fixed;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: none;
            flex-direction: row;
            gap: 40px;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .server-menu-overlay.show {
            display: flex;
        }

        .server-menu-btn {
            width: 170px;
            height: 170px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.15s;
            border: none;
            background: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
            border-radius: 24px;
        }
        .server-menu-btn:active {
            transform: scale(0.94);
        }
        .server-menu-btn:hover {
            transform: scale(1.05);
        }

        .bottom-buttons {
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            z-index: 100;
        }
        .bottom-btn {
            width: 110px;
            height: 110px;
            object-fit: contain;
            cursor: pointer;
            transition: 0.2s;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
            display: block;
            background: transparent;
            border: none;
        }
        .bottom-btn:active {
            transform: scale(0.96);
        }

        .profile-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background-image: url('IMG_20260405_103001_954.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1000;
            transition: 0.4s ease;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .profile-modal.open {
            right: 0;
        }
        .close-profile {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }
        .profile-avatar-circle {
            width: 130px;
            height: 130px;
            margin: 70px auto 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #2ecc71;
        }
        .profile-avatar-circle img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .edit-name {
            background: #2ecc71;
            border: none;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 13px;
            cursor: pointer;
            color: white;
        }
        .profile-userid {
            text-align: center;
            background: rgba(0,0,0,0.5);
            width: fit-content;
            margin: 10px auto;
            padding: 6px 18px;
            border-radius: 40px;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
        }
        .profile-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px;
            background: rgba(0,0,0,0.45);
            padding: 15px;
            border-radius: 25px;
        }
        .stat-box {
            text-align: center;
            color: white;
            min-width: 70px;
            font-size: 13px;
        }
        .profile-group {
            text-align: center;
            color: #ffd966;
            margin: 10px;
        }
        .settings-btn {
            background: #2ecc71;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 200px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .settings-btn:active {
            transform: scale(0.96);
        }

        .settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 20px;
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 1px solid #2ecc71;
        }
        .settings-modal.open {
            display: flex;
        }
        .settings-modal h3 {
            color: white;
        }
        .volume-slider {
            width: 100%;
            direction: ltr;
        }
        .close-settings {
            background: #e94560;
            border: none;
            border-radius: 30px;
            padding: 6px 20px;
            color: white;
            cursor: pointer;
        }

        .shop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('IMG_20260405_103001_954.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }
        .shop-overlay.open {
            display: flex;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.6);
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .shop-back {
            font-size: 26px;
            color: white;
            cursor: pointer;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shop-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .shop-tab {
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .shop-tab.active {
            background: #2ecc71;
            color: black;
        }
        .shop-section {
            margin-bottom: 30px;
        }
        .section-title {
            color: gold;
            font-size: 16px;
            margin: 15px 0 10px;
            text-align: center;
            font-weight: bold;
        }
        .shop-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            padding: 10px;
        }
        .shop-card {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .shop-card img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .shop-card .price {
            color: gold;
            margin: 5px 0;
            font-size: 12px;
        }
        .shop-card button {
            background: #2ecc71;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 11px;
            margin-top: 4px;
        }
        .shop-card .owned-badge {
            color: #2ecc71;
            font-weight: bold;
            font-size: 12px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="main-page">
    <!-- حساب کاربری -->
    <div class="account-card" id="accountCard">
        <img class="account-avatar" id="accountAvatar" src="" alt="avatar">
        <div class="account-info">
            <div class="account-name">
                <span id="accountName"></span>
                <span id="accountTick" class="rank-tick" style="display:none;"></span>
            </div>
            <div class="account-level" id="accountLevel">سطح 1</div>
        </div>
    </div>

    <!-- جم و سکه -->
    <div class="currency-bar">
        <div class="currency-item"><span>🪙</span> <span id="coinAmount">0</span></div>
        <div class="currency-item"><span>💎</span> <span id="gemAmount">0</span></div>
    </div>

    <!-- منوی اپلیکیشنی -->
    <div class="app-menu-container">
        <div class="menu-toggle-btn" id="menuToggle">
            <span class="icon">☰</span>
            <span class="badge" id="menuBadge">●</span>
        </div>
        <div class="app-menu" id="appMenu">
            <button class="menu-item" data-section="donate">
                <span class="icon">🎁</span>
                <span class="label">اهدای جم</span>
                <span class="arrow">›</span>
            </button>
            <button class="menu-item" data-section="groups">
                <span class="icon">👥</span>
                <span class="label">گروه‌ها</span>
                <span class="arrow">›</span>
            </button>
            <button class="menu-item" data-section="rankings">
                <span class="icon">🏆</span>
                <span class="label">رتبه‌بندی</span>
                <span class="arrow">›</span>
            </button>
            <button class="menu-item" data-section="live">
                <span class="icon">📺</span>
                <span class="label">پخش زنده</span>
                <span class="arrow">›</span>
            </button>
            <div class="menu-divider"></div>
            <button class="menu-item" data-section="gem-shop">
                <span class="icon">❌</span>
                <span class="label">فروشگاه جم و سکه</span>
                <span class="arrow">›</span>
            </button>
            <button class="menu-item" data-section="shop">
                <span class="icon">🛍️</span>
                <span class="label">فروشگاه آواتار</span>
                <span class="arrow">›</span>
            </button>
            <button class="menu-item" data-section="profile">
                <span class="icon">👤</span>
                <span class="label">پروفایل</span>
                <span class="arrow">›</span>
            </button>
        </div>
    </div>

    <!-- منوی سرورها -->
    <div class="server-menu-backdrop" id="serverBackdrop"></div>
    <div class="server-menu-overlay" id="serverMenu">
        <img class="server-menu-btn" id="adultServerBtn" src="InShot_20260616_223548506.jpg" alt="سرور بزرگسالان">
        <img class="server-menu-btn" id="teenServerBtn" src="IMG_20260611_130124_981.jpg" alt="سرور نوجوانان">
    </div>

    <!-- دکمه‌های پایین -->
    <div class="bottom-buttons">
        <img class="bottom-btn" id="serverBtn" src="InShot_20260607_182328911.png" alt="سرورها">
        <img class="bottom-btn" id="competitiveBtn" src="InShot_20260607_175214175.png" alt="رقابتی">
    </div>
</div>

<!-- مودال پروفایل -->
<div id="profileModal" class="profile-modal">
    <div class="close-profile" id="closeProfileBtn">✕</div>
    <div class="profile-avatar-circle" id="profileAvatarCircle">
        <img id="profileAvatarImg" src="" alt="avatar">
    </div>
    <div class="profile-name">
        <span id="profileName"></span>
        <button class="edit-name" id="editNameBtn">✎</button>
        <span id="profileTick" class="rank-tick" style="display:none;"></span>
    </div>
    <div class="profile-userid" id="userIdCopy">کد کاربری: <span id="userIdCode"></span> 📋</div>
    <div class="profile-group" id="groupName">گروه: بدون گروه</div>
    <div class="profile-stats">
        <div class="stat-box">⏱️ ساعت بازی<br><span id="playHours">0</span></div>
        <div class="stat-box">👀 ناظری<br><span id="observerCount">0</span></div>
        <div class="stat-box">🏆 برد سرور<br><span id="serverWins">0</span></div>
        <div class="stat-box">⚔️ برد رقابتی<br><span id="compWins">0</span></div>
        <div class="stat-box">🎖️ کاپ<br><span id="cups">0</span></div>
    </div>
    <div class="settings-btn" id="settingsBtn">تنظیمات صدا</div>
</div>

<!-- مودال تنظیمات -->
<div id="settingsModal" class="settings-modal">
    <h3>تنظیم صدای آهنگ</h3>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50">
    <button class="close-settings" id="closeSettingsBtn">بستن</button>
</div>

<!-- فروشگاه -->
<div id="shopOverlay" class="shop-overlay">
    <div class="shop-header">
        <div class="shop-back" id="shopBackBtn">←</div>
        <div class="shop-tabs">
            <div class="shop-tab" data-shop-tab="my">خریدهای من</div>
            <div class="shop-tab" data-shop-tab="store">خریدها</div>
        </div>
        <div style="width:36px;"></div>
    </div>
    <div id="shopContent"></div>
</div>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
<audio id="clickSound" src="sedatoseda.ir.mp3" preload="auto"></audio>

<script>
    // ==================== اطلاعات کاربر از sessionStorage ====================
    let currentUserPhone = sessionStorage.getItem('currentUserPhone');
    let currentUserRank = sessionStorage.getItem('currentUserRank') || 'کاربر';
    let currentUserName = sessionStorage.getItem('currentUserName') || 'کاربر';
    let currentUserAvatar = sessionStorage.getItem('currentUserAvatar') || 'InShot_20260225_191621541.png';
    let currentUserAge = parseInt(sessionStorage.getItem('currentUserAge')) || 0;
    let canAccessAdult = sessionStorage.getItem('canAccessAdult') === 'true';
    let canAccessTeen = sessionStorage.getItem('canAccessTeen') === 'true';

    // ==================== دیتابیس محلی ====================
    let usersDB = JSON.parse(localStorage.getItem('mafia_users')) || {};
    let userData = usersDB[currentUserPhone];
    if (!userData) {
        userData = {
            name: currentUserName,
            avatar: currentUserAvatar,
            rank: currentUserRank,
            age: currentUserAge,
            level: 1,
            coins: 200,
            gems: 10,
            playHours: 12,
            observerCount: 3,
            serverWins: 8,
            compWins: 5,
            cups: 2,
            group: 'مافیا',
            ownedAvatars: ['InShot_20260225_191621541.png','InShot_20260224_194133998.png','InShot_20260208_214035107.png','InShot_20260208_214116629.png'],
            ownedFrames: ['InShot_20260607_164903273.png'],
            currentAvatar: currentUserAvatar,
            currentFrame: 'InShot_20260607_164903273.png',
            canAccessAdult: canAccessAdult,
            canAccessTeen: canAccessTeen
        };
        usersDB[currentUserPhone] = userData;
        localStorage.setItem('mafia_users', JSON.stringify(usersDB));
    } else {
        userData.canAccessAdult = canAccessAdult;
        userData.canAccessTeen = canAccessTeen;
        userData.age = currentUserAge;
        if (!userData.ownedAvatars) userData.ownedAvatars = ['InShot_20260225_191621541.png','InShot_20260224_194133998.png','InShot_20260208_214035107.png','InShot_20260208_214116629.png'];
        if (!userData.ownedFrames) userData.ownedFrames = ['InShot_20260607_164903273.png'];
        usersDB[currentUserPhone] = userData;
        localStorage.setItem('mafia_users', JSON.stringify(usersDB));
    }

    // ==================== آواتارهای جدید فروشگاه ====================
    const storeAvatars = [
        { src: 'InShot_20260219_185448062.png', price: 200, currency: 'gems', name: 'آواتار شعله‌ای' },
        { src: 'InShot_20260219_185413696.png', price: 190, currency: 'gems', name: 'آواتار آبی' },
        { src: 'InShot_20260219_185328676.png', price: 100, currency: 'gems', name: 'آواتار سبز' },
        { src: 'InShot_20260219_185247894.png', price: 150, currency: 'gems', name: 'آواتار طلایی' },
        { src: 'InShot_20260219_185152210.png', price: 100, currency: 'coins', name: 'آواتار صورتی' },
        { src: 'InShot_20260219_185049749.png', price: 200, currency: 'coins', name: 'آواتار نارنجی' },
        { src: 'InShot_20260217_183611271.png', price: 150, currency: 'gems', name: 'آواتار بنفش' },
        { src: 'InShot_20260216_031531507.png', price: 180, currency: 'gems', name: 'آواتار یخی' },
        { src: 'InShot_20260216_031443956.png', price: 300, currency: 'gems', name: 'آواتار الماسی' },
        { src: 'InShot_20260216_031355260.png', price: 200, currency: 'gems', name: 'آواتار سلطنتی' },
        { src: 'InShot_20260213_195217329.png', price: 80, currency: 'gems', name: 'آواتار ساده ۱' },
        { src: 'InShot_20260213_195059047.png', price: 80, currency: 'gems', name: 'آواتار ساده ۲' }
    ];
    const storeFrames = [];

    // ==================== صداها ====================
    const bgAudio = document.getElementById('bgMusic');
    const clickAudio = document.getElementById('clickSound');

    bgAudio.volume = 0.5;
    function playClick() {
        const sound = clickAudio.cloneNode();
        sound.volume = 0.3;
        sound.play().catch(e => console.log("صدای کلیک پخش نشد:", e));
    }

    const volumeSlider = document.getElementById('volumeSlider');
    volumeSlider.addEventListener('input', (e) => {
        bgAudio.volume = e.target.value / 100;
    });

    const settingsModal = document.getElementById('settingsModal');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    settingsBtn.addEventListener('click', () => {
        playClick();
        settingsModal.classList.add('open');
    });
    closeSettingsBtn.addEventListener('click', () => {
        playClick();
        settingsModal.classList.remove('open');
    });
    window.addEventListener('click', (e) => {
        if (e.target === settingsModal) {
            settingsModal.classList.remove('open');
        }
    });

    window.addEventListener('load', () => {
        bgAudio.play().catch(e => {
            document.body.addEventListener('click', () => bgAudio.play(), { once: true });
        });
    });

    // ==================== توابع UI ====================
    function getTickClass(rank) {
        const map = {
            'سازنده': 'tick-blue-dark',
            'پشتیبانی': 'tick-blue-light',
            'گرداننده': 'tick-red',
            'ادمین ارشد': 'tick-black',
            'ادمین': 'tick-brown',
            'ناظر': 'tick-orange',
            'ناظر ارشد': 'tick-purple',
            'کاربر ویژه': 'tick-white'
        };
        return map[rank] || '';
    }

    function updateUI() {
        document.getElementById('accountName').innerText = userData.name;
        document.getElementById('accountAvatar').src = userData.currentAvatar;
        document.getElementById('coinAmount').innerText = userData.coins || 0;
        document.getElementById('gemAmount').innerText = userData.gems || 0;
        document.getElementById('accountLevel').innerHTML = 'سطح ' + (Math.floor(userData.level) || 1);

        const rank = userData.rank;
        const specialRanks = ['سازنده', 'پشتیبانی', 'گرداننده', 'ادمین ارشد', 'ادمین', 'ناظر', 'ناظر ارشد', 'کاربر ویژه'];
        const hasTick = specialRanks.includes(rank);
        const tickClass = getTickClass(rank);
        document.getElementById('accountTick').style.display = hasTick ? 'inline-block' : 'none';
        if (hasTick) {
            document.getElementById('accountTick').className = 'rank-tick ' + tickClass;
            document.getElementById('accountTick').innerText = '✓';
        }
        document.getElementById('profileTick').style.display = hasTick ? 'inline-block' : 'none';
        if (hasTick) {
            document.getElementById('profileTick').className = 'rank-tick ' + tickClass;
            document.getElementById('profileTick').innerText = '✓';
        }
        document.getElementById('profileName').innerText = userData.name;
        document.getElementById('profileAvatarImg').src = userData.currentAvatar;
        document.getElementById('userIdCode').innerText = generateUserId(currentUserPhone);
        document.getElementById('playHours').innerText = userData.playHours || 0;
        document.getElementById('observerCount').innerText = userData.observerCount || 0;
        document.getElementById('serverWins').innerText = userData.serverWins || 0;
        document.getElementById('compWins').innerText = userData.compWins || 0;
        document.getElementById('cups').innerText = userData.cups || 0;
        document.getElementById('groupName').innerHTML = 'گروه: ' + (userData.group || 'مافیا');
    }

    function generateUserId(phone) {
        let hash = 0;
        for(let i=0; i<phone.length; i++) hash = ((hash<<5)-hash)+phone.charCodeAt(i);
        return Math.abs(hash % 100000000) + 1;
    }

    document.getElementById('userIdCopy')?.addEventListener('click', () => {
        playClick();
        navigator.clipboard.writeText(document.getElementById('userIdCode').innerText);
        alert('کد کاربری کپی شد');
    });

    let nameChangeUsed = false;
    document.getElementById('editNameBtn')?.addEventListener('click', () => {
        playClick();
        let newName = prompt('اسم جدید خود را وارد کنید', userData.name);
        if(newName && newName.trim()) {
            if(!nameChangeUsed && userData.coins >= 100) {
                userData.coins -= 100;
                nameChangeUsed = true;
                userData.name = newName.trim();
                usersDB[currentUserPhone] = userData;
                localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                updateUI();
                alert('اسم شما به ' + newName + ' تغییر کرد. ۱۰۰ سکه کسر شد.');
            } else if(nameChangeUsed) alert('شما قبلاً یک بار نام خود را تغییر داده‌اید.');
            else alert('سکه کافی نیست!');
        }
    });

    document.getElementById('accountCard').onclick = () => {
        playClick();
        document.getElementById('profileModal').classList.add('open');
        updateUI();
    };
    document.getElementById('closeProfileBtn').onclick = () => {
        playClick();
        document.getElementById('profileModal').classList.remove('open');
    };
    document.getElementById('profileAvatarCircle').onclick = () => {
        playClick();
        openShop();
    };

    // ==================== فروشگاه ====================
    const shopOverlay = document.getElementById('shopOverlay');
    const shopContent = document.getElementById('shopContent');
    let currentShopTab = 'my';

    function openShop() {
        playClick();
        shopOverlay.classList.add('open');
        renderShop();
    }
    function closeShop() {
        playClick();
        shopOverlay.classList.remove('open');
    }
    document.getElementById('shopBackBtn').onclick = closeShop;

    function renderShop() {
        shopContent.innerHTML = '';
        if (currentShopTab === 'my') {
            const ownedAvatars = userData.ownedAvatars || [];
            const ownedFrames = userData.ownedFrames || [];
            if (ownedAvatars.length) {
                const sec = document.createElement('div');
                sec.className = 'shop-section';
                sec.innerHTML = '<div class="section-title">آواتارهای من</div><div class="shop-items-grid" id="myAvatarsGrid"></div>';
                shopContent.appendChild(sec);
                const grid = sec.querySelector('#myAvatarsGrid');
                ownedAvatars.forEach(av => {
                    const card = document.createElement('div');
                    card.className = 'shop-card';
                    card.innerHTML = `<img src="${av}"><div class="owned-badge">مالک</div><button>انتخاب</button>`;
                    const btn = card.querySelector('button');
                    btn.onclick = () => {
                        playClick();
                        userData.currentAvatar = av;
                        usersDB[currentUserPhone] = userData;
                        localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                        updateUI();
                        alert('آواتار جاری تغییر کرد');
                        renderShop();
                    };
                    grid.appendChild(card);
                });
            }
            if (ownedFrames.length) {
                const sec = document.createElement('div');
                sec.className = 'shop-section';
                sec.innerHTML = '<div class="section-title">قالب‌های من</div><div class="shop-items-grid" id="myFramesGrid"></div>';
                shopContent.appendChild(sec);
                const grid = sec.querySelector('#myFramesGrid');
                ownedFrames.forEach(fr => {
                    const card = document.createElement('div');
                    card.className = 'shop-card';
                    card.innerHTML = `<img src="${fr}" style="border-radius:12px;"><div class="owned-badge">مالک</div><button>انتخاب قالب</button>`;
                    const btn = card.querySelector('button');
                    btn.onclick = () => {
                        playClick();
                        userData.currentFrame = fr;
                        usersDB[currentUserPhone] = userData;
                        localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                        updateUI();
                        alert('قالب جاری تغییر کرد');
                        renderShop();
                    };
                    grid.appendChild(card);
                });
            }
        } else {
            const sec = document.createElement('div');
            sec.className = 'shop-section';
            sec.innerHTML = '<div class="section-title">آواتارهای فروشگاه</div><div class="shop-items-grid" id="storeAvatarsGrid"></div>';
            shopContent.appendChild(sec);
            const grid = sec.querySelector('#storeAvatarsGrid');
            storeAvatars.forEach(item => {
                const alreadyOwned = userData.ownedAvatars ? userData.ownedAvatars.includes(item.src) : false;
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.innerHTML = `<img src="${item.src}"><div class="price">${item.price} ${item.currency === 'gems' ? 'جم' : 'سکه'}</div>`;
                if (!alreadyOwned) {
                    const btn = document.createElement('button');
                    btn.innerText = 'خرید';
                    btn.onclick = () => {
                        playClick();
                        if (item.currency === 'gems' && userData.gems >= item.price) {
                            userData.gems -= item.price;
                            if (!userData.ownedAvatars) userData.ownedAvatars = [];
                            userData.ownedAvatars.push(item.src);
                            usersDB[currentUserPhone] = userData;
                            localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                            alert('خرید موفق!');
                            renderShop();
                            updateUI();
                        } else if (item.currency === 'coins' && userData.coins >= item.price) {
                            userData.coins -= item.price;
                            if (!userData.ownedAvatars) userData.ownedAvatars = [];
                            userData.ownedAvatars.push(item.src);
                            usersDB[currentUserPhone] = userData;
                            localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                            alert('خرید موفق!');
                            renderShop();
                            updateUI();
                        } else alert('اعتبار کافی نیست');
                    };
                    card.appendChild(btn);
                } else {
                    card.innerHTML += `<div class="owned-badge">مالک</div><button>انتخاب</button>`;
                    const selectBtn = card.querySelector('button:not(.owned-badge)');
                    selectBtn.onclick = () => {
                        playClick();
                        userData.currentAvatar = item.src;
                        usersDB[currentUserPhone] = userData;
                        localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                        updateUI();
                        alert('آواتار جاری تغییر کرد');
                        renderShop();
                    };
                }
                grid.appendChild(card);
            });
            if (storeFrames.length) {
                const sec2 = document.createElement('div');
                sec2.className = 'shop-section';
                sec2.innerHTML = '<div class="section-title">قالب‌های فروشگاه</div><div class="shop-items-grid" id="storeFramesGrid"></div>';
                shopContent.appendChild(sec2);
                const grid2 = sec2.querySelector('#storeFramesGrid');
                storeFrames.forEach(frame => {
                    const alreadyOwned = userData.ownedFrames ? userData.ownedFrames.includes(frame.src) : false;
                    const card = document.createElement('div');
                    card.className = 'shop-card';
                    card.innerHTML = `<img src="${frame.src}" style="border-radius:12px;"><div class="price">${frame.price} سکه</div>`;
                    if (!alreadyOwned && frame.price > 0) {
                        const btn = document.createElement('button');
                        btn.innerText = 'خرید';
                        btn.onclick = () => {
                            playClick();
                            if (userData.coins >= frame.price) {
                                userData.coins -= frame.price;
                                if (!userData.ownedFrames) userData.ownedFrames = [];
                                userData.ownedFrames.push(frame.src);
                                usersDB[currentUserPhone] = userData;
                                localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                                alert('قالب خریداری شد');
                                renderShop();
                                updateUI();
                            } else alert('سکه کافی نیست');
                        };
                        card.appendChild(btn);
                    } else if (alreadyOwned) {
                        card.innerHTML += `<div class="owned-badge">مالک</div><button>انتخاب</button>`;
                        const selectBtn = card.querySelector('button:not(.owned-badge)');
                        selectBtn.onclick = () => {
                            playClick();
                            userData.currentFrame = frame.src;
                            usersDB[currentUserPhone] = userData;
                            localStorage.setItem('mafia_users', JSON.stringify(usersDB));
                            updateUI();
                            alert('قالب جاری تغییر کرد');
                            renderShop();
                        };
                    }
                    grid2.appendChild(card);
                });
            }
        }
    }

    document.querySelectorAll('.shop-tab').forEach(tab => {
        tab.onclick = () => {
            playClick();
            document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentShopTab = tab.getAttribute('data-shop-tab');
            renderShop();
        };
    });

    // ==================== منوی اپلیکیشنی ====================
    const menuToggle = document.getElementById('menuToggle');
    const appMenu = document.getElementById('appMenu');
    const menuBadge = document.getElementById('menuBadge');

    menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        playClick();
        appMenu.classList.toggle('open');
        menuBadge.style.display = 'none';
    });

    document.addEventListener('click', (e) => {
        if (!appMenu.contains(e.target) && e.target !== menuToggle && !menuToggle.contains(e.target)) {
            appMenu.classList.remove('open');
        }
    });

    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', (e) => {
            playClick();
            appMenu.classList.remove('open');
            const section = item.dataset.section;
            switch(section) {
                case 'donate':
                    alert('🎁 بخش اهدای جم - به زودی');
                    break;
                case 'groups':
                    alert('👥 بخش گروه‌ها - به زودی');
                    break;
                case 'rankings':
                    alert('🏆 بخش رتبه‌بندی - به زودی');
                    break;
                case 'live':
                    alert('📺 پخش زنده - به زودی');
                    break;
                case 'gem-shop':
                    alert('❌ فروشگاه جم و سکه - به زودی');
                    break;
                case 'shop':
                    openShop();
                    break;
                case 'profile':
                    document.getElementById('profileModal').classList.add('open');
                    updateUI();
                    break;
                default:
                    break;
            }
        });
    });

    // ==================== منوی سرورها ====================
    const serverMenu = document.getElementById('serverMenu');
    const serverBackdrop = document.getElementById('serverBackdrop');
    const serverBtn = document.getElementById('serverBtn');
    const adultBtn = document.getElementById('adultServerBtn');
    const teenBtn = document.getElementById('teenServerBtn');

    function openServerMenu() {
        serverMenu.classList.add('show');
        serverBackdrop.classList.add('show');
    }

    function closeServerMenu() {
        serverMenu.classList.remove('show');
        serverBackdrop.classList.remove('show');
    }

    serverBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playClick();
        if (serverMenu.classList.contains('show')) {
            closeServerMenu();
        } else {
            openServerMenu();
        }
    });

    serverBackdrop.addEventListener('click', closeServerMenu);

    adultBtn.addEventListener('click', () => {
        playClick();
        if (userData.canAccessAdult) {
            alert('✅ ورود به سرور بزرگسالان');
        } else {
            alert('❌ شما دسترسی به سرور بزرگسالان ندارید.');
        }
        closeServerMenu();
    });

    teenBtn.addEventListener('click', () => {
        playClick();
        if (userData.canAccessTeen) {
            alert('✅ ورود به سرور نوجوانان');
        } else {
            alert('❌ شما دسترسی به سرور نوجوانان ندارید.');
        }
        closeServerMenu();
    });

    // ==================== دکمه رقابتی ====================
    document.getElementById('competitiveBtn').onclick = () => {
        playClick();
        window.location.href = 'Regabati.html';
    };

    // ==================== شروع ====================
    updateUI();
</script>
</body>
</html>

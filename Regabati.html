<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رقابتی | مافیا</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
    font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    min-height:100vh;
    background-image:url('IMG_20260607_211616_929.jpg');
    background-size:cover; background-position:center;
    background-repeat:no-repeat; background-attachment:fixed;
}
@keyframes fadePulse {
    0% { opacity:0.7; transform:translateX(-50%) scale(1); }
    50% { opacity:1; transform:translateX(-50%) scale(1.03); }
    100% { opacity:0.7; transform:translateX(-50%) scale(1); }
}
.waiting-text {
    position:fixed; top:30px; left:50%; transform:translateX(-50%);
    color:white; font-size:28px; font-weight:bold; text-align:center;
    white-space:nowrap; z-index:100;
    animation:fadePulse 1.5s ease-in-out infinite;
    text-shadow: 0 2px 15px rgba(0,0,0,0.9);
}
.back-button {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    width:60px; height:60px; cursor:pointer;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4)); z-index:200;
}
.back-button:active { transform:translateX(-50%) scale(0.94); }
</style>
</head>
<body>
<div class="waiting-text" id="waitingText">در حال اتصال...</div>
<img class="back-button" id="backBtn" src="InShot_20260608_012500931.png" alt="بازگشت">
<audio id="clickSound" src="sedatoseda.ir.mp3" preload="auto"></audio>

<script>
// ==================== تنظیمات JSONBin (جدید) ====================
const JSONBIN_ID = '6a310a04da38895dfec86661';
const API_KEY = '$2a$10$G8pgSWnFz4w/.voj3lfBPuJL7luRXAXiR/fIufC3YIB4.qRkZSjSS';
const BIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
const GAME_PAGE_URL = 'index.html'; // صفحه اصلی بازی

// ========== صدا ==========
const clickAudio = document.getElementById('clickSound');
function playClick() {
    const sound = clickAudio.cloneNode();
    sound.volume = 0.3;
    sound.play().catch(e => {});
}

// ========== اطلاعات کاربر ==========
let playerId = sessionStorage.getItem('regabati_playerId');
if(!playerId) {
    playerId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    sessionStorage.setItem('regabati_playerId', playerId);
}

let playerName = sessionStorage.getItem('mafiaUserName');
if(!playerName) {
    playerName = 'بازیکن_' + Math.floor(Math.random()*1000);
    sessionStorage.setItem('mafiaUserName', playerName);
}

let currentCount = 0;
let isStarted = false;
let pollInterval = null;
let isLeaving = false;
let isUpdating = false;
let updateQueue = Promise.resolve();
const waitingDiv = document.getElementById('waitingText');

// ========== دریافت وضعیت از JSONBin ==========
async function fetchState() {
    try {
        const res = await fetch(BIN_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': API_KEY,
                'Accept': 'application/json'
            }
        });
        if(!res.ok) {
            console.error('Fetch failed:', res.status);
            return null;
        }
        const data = await res.json();
        return data.record;
    } catch(e) {
        console.error('Fetch error:', e);
        return null;
    }
}

// ========== ذخیره وضعیت در JSONBin (با قفل) ==========
function safeUpdate(modifyFn) {
    updateQueue = updateQueue.then(async () => {
        if(isLeaving) return false;
        isUpdating = true;
        
        for(let attempt = 0; attempt < 5; attempt++) {
            try {
                const state = await fetchState();
                if(!state) {
                    await new Promise(r => setTimeout(r, 400));
                    continue;
                }
                
                if(!state.competitive) state.competitive = { count: 0, players: [] };
                if(!state.competitive.players) state.competitive.players = [];
                
                const changed = modifyFn(state);
                if(!changed) {
                    isUpdating = false;
                    return true;
                }
                
                const putRes = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(state)
                });
                
                if(putRes.ok) {
                    isUpdating = false;
                    return true;
                }
                
                console.warn('PUT failed, retry...', attempt);
                await new Promise(r => setTimeout(r, 400));
            } catch(e) {
                console.error('Update error:', e);
                await new Promise(r => setTimeout(r, 400));
            }
        }
        
        isUpdating = false;
        return false;
    });
    
    return updateQueue;
}

// ========== به‌روزرسانی UI ==========
function updateUI() {
    waitingDiv.innerText = `در حال انتظار ${currentCount}...`;
    if(currentCount >= 10 && !isStarted) {
        isStarted = true;
        if(pollInterval) clearInterval(pollInterval);
        waitingDiv.innerText = '🎮 شروع بازی...';
        setTimeout(() => {
            window.location.href = GAME_PAGE_URL;
        }, 2000);
    }
}

// ========== ورود به بازی ==========
async function joinGame() {
    waitingDiv.innerText = 'در حال اتصال...';
    
    const success = await safeUpdate((state) => {
        // آیا قبلاً در لیست هستم؟
        const existing = state.competitive.players.find(p => p.id === playerId);
        if(existing) return false;
        
        // اگر ۱۰ نفر پر است
        if(state.competitive.players.length >= 10) return false;
        
        // اضافه کردن کاربر جدید
        state.competitive.players.push({
            id: playerId,
            name: playerName,
            joinedAt: Date.now()
        });
        state.competitive.count = state.competitive.players.length;
        state.competitive.lastUpdate = Date.now();
        
        return true;
    });
    
    if(success) {
        const state = await fetchState();
        if(state && state.competitive) {
            currentCount = state.competitive.players.length;
            updateUI();
        }
        startPolling();
    } else {
        // اگر کاربر قبلاً داخل لیست است، فقط از سرور بخوان
        const state = await fetchState();
        if(state && state.competitive) {
            const existing = state.competitive.players.find(p => p.id === playerId);
            if(existing) {
                currentCount = state.competitive.players.length;
                updateUI();
                startPolling();
                return;
            }
        }
        // اگر خطا بود، مجدد تلاش کن
        setTimeout(joinGame, 2000);
    }
}

// ========== خروج از بازی ==========
async function leaveGame() {
    if(isLeaving) return;
    isLeaving = true;
    
    await safeUpdate((state) => {
        if(!state.competitive || !state.competitive.players) return false;
        
        const before = state.competitive.players.length;
        state.competitive.players = state.competitive.players.filter(p => p.id !== playerId);
        
        if(state.competitive.players.length === before) return false;
        
        state.competitive.count = state.competitive.players.length;
        state.competitive.lastUpdate = Date.now();
        return true;
    });
}

// ========== نظرسنجی دوره‌ای ==========
async function pollState() {
    if(isUpdating) return;
    
    const state = await fetchState();
    if(!state) return;
    
    if(!state.competitive) state.competitive = { count: 0, players: [] };
    if(!state.competitive.players) state.competitive.players = [];
    
    const newCount = state.competitive.players.length;
    
    if(newCount !== currentCount) {
        currentCount = newCount;
        updateUI();
    }
    
    // اگر بازی شروع شده
    if(state.game && state.game.started && !isStarted) {
        isStarted = true;
        if(pollInterval) clearInterval(pollInterval);
        waitingDiv.innerText = '🎮 ورود به بازی...';
        setTimeout(() => {
            window.location.href = GAME_PAGE_URL;
        }, 1000);
    }
}

function startPolling() {
    if(pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(pollState, 2000);
}

// ========== رویدادها ==========
window.addEventListener('beforeunload', () => {
    leaveGame();
});

document.getElementById('backBtn').addEventListener('click', () => {
    playClick();
    leaveGame();
    setTimeout(() => {
        window.location.href = 'Safe Asli Bazi.html';
    }, 300);
});

// ========== شروع ==========
joinGame();
</script>
</body>
</html>
